<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shreya’s Birthday Picnic</title>

  <link rel="stylesheet" href="style.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- SCRIBBLES -->
<div class="scribble s1">✿</div>
<div class="scribble s2">~~~</div>
<div class="scribble s3">☼</div>
<div class="scribble s4">◌</div>

<!-- MAIN -->
<section class="hero">

  <div class="hero-content">

    <p class="tiny">you’re invited to</p>

    <h1>Shreya’s Birthday Picnic 🌸🍦</h1>

    <p class="subtitle">
      saturday, 20 june · 11:00 — 13:00
    </p>

    <p class="subtitle">
  <a 
    href="https://maps.app.goo.gl/vvvFHDhbfaD9DyYg6?g_st=ic" 
    target="_blank"
    class="location-link"
  >
    📍 Beaver Lake Fountain
  </a>
</p>
    
    <div class="info">
      <p>🤙🏻 Snacks are on me · BYOB</p>
      <p>Please get a beach blanket or a mat if you can ⛱️ </p>
    </div>

    <a href="#rsvp" class="link-btn">
      count me in →
    </a>

  </div>

</section>

<!-- RSVP -->
<section id="rsvp" class="rsvp-section">

  <h2>let me know :)</h2>

  <form 
    action="https://formspree.io/f/mgoljvbj" 
    method="POST"
    id="rsvp-form"
  >

    <input 
      type="text" 
      name="name" 
      placeholder="your name" 
      required
    >

    <select name="attendance" required>
      <option value="" disabled selected>
        will you be there?
      </option>

      <option value="yes">
        yes 🌞
      </option>

      <option value="maybe">
        maybe 🤞
      </option>

      <option value="no">
        no 😔
      </option>
    </select>

    <select name="plus_one">
      <option value="" disabled selected>
        bringing a plus one?
      </option>

      <option value="no">
        no
      </option>

      <option value="yes">
        yes
      </option>
    </select>

    <button type="submit">
      send
    </button>

  </form>

  <p id="success-message">
    🌞 got it — see you at the picnic
  </p>

</section>

<!-- FOOTER -->
<footer>
  <a 
    href="https://wa.me/+12633552761" 
    target="_blank"
  >
    questions? text me
  </a>
  </p>
</footer>

<script src="script.js"></script>

</body>
</html>
