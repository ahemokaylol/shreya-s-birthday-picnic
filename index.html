<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Picnic Birthday 🌿</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
</head>

<body>

<!-- FLOATING STICKERS -->
<div class="sticker">🍓</div>
<div class="sticker">🌼</div>
<div class="sticker">☀️</div>
<div class="sticker">🧺</div>
<div class="sticker">🍹</div>
<div class="sticker">🌿</div>

<!-- HERO -->
<section class="hero">
  <div class="hero-content">
    <h1>Shreshtha’s Picnic Birthday 🌿</h1>
    <p class="subtitle">sunlight, snacks, and soft chaos</p>

    <p class="details">📅 Saturday, 20 June</p>
    <p class="details">🕒 11:00 – 13:00</p>
    <p class="details">📍 Location: TBD</p>

    <a href="#rsvp" class="btn">RSVP</a>
  </div>
</section>

<!-- INFO -->
<section class="section reveal">
  <div class="card">
    <p>🧺 I’ll bring picnic snacks</p>
    <p>🍹 Drinks are BYOB</p>
    <p>🪑 Blankets/mats will be there (bring one if you can)</p>
  </div>
</section>

<!-- RSVP -->
<section id="rsvp" class="section reveal">
  <h2>RSVP</h2>

  <form action="https://formspree.io/f/mgoljvbj" method="POST">
    <input type="text" name="name" placeholder="Your Name" required>

    <select name="attendance">
      <option value="yes">Coming 🌞</option>
      <option value="no">Can’t make it</option>
    </select>

    <input type="text" name="comments" placeholder="Message / what you're bringing (optional)">

    <button type="submit">Submit</button>
  </form>
</section>

<script src="script.js"></script>

</body>
</html>
